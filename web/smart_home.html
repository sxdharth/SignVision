<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignVision | Smart Automation</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Standalone Production Style specific for Smart Home */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulse-glow 6s infinite alternate;
        }

        @keyframes pulse-glow {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .brand {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
            padding: 30px 40px;
            flex: 1;
            z-index: 10;
        }

        /* Camera Panel */
        .camera-panel {
            background: rgba(15, 15, 17, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.4s ease;
        }

        .cam-feed {
            flex: 1;
            position: relative;
            background: #000;
            min-height: 250px;
        }

        video,
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            position: absolute;
            top: 0;
            left: 0;
        }

        .status-bar {
            padding: 20px;
            background: rgba(10, 10, 12, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        #modeIndicator {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .last-cmd {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f5f9;
            transition: color 0.3s;
        }

        .last-cmd.success {
            color: #10b981;
        }

        /* Detection States */
        .camera-panel.state-detecting {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        .camera-panel.state-cooldown {
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
        }

        .camera-panel.state-executing {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            animation: pulse-blue 1.5s infinite alternate;
        }

        @keyframes pulse-blue {
            0% {
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            }

            100% {
                box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            }
        }

        /* Devices Grid */
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            align-content: start;
        }

        .device-card {
            background: rgba(15, 15, 17, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 190px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .device-card:hover {
            transform: translateY(-5px);
            background: rgba(20, 20, 22, 0.8);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .device-icon {
            font-size: 2.5rem;
            color: #52525b;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .device-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: #fff;
        }

        .device-status {
            font-size: 0.9rem;
            color: #a1a1aa;
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Device Active State */
        .device-card.active {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.05);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.1);
        }

        .device-card.active .device-icon {
            color: #10b981;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.6));
        }

        .device-card.active .device-status {
            color: #10b981;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(15, 15, 17, 0.95);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .camera-panel {
                height: 350px;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <header>
        <div class="brand">
            <i class="fas fa-microchip" style="color: #10b981;"></i> SignVision IoT
        </div>
        <div class="header-actions">
            <button id="automationToggleBtn" onclick="toggleAutomation()" class="btn btn-danger"
                title="Pause Automation">
                <i class="fas fa-pause"></i> <span>Stop Automation</span>
            </button>
            <a href="/" class="btn">
                <i class="fas fa-arrow-left"></i> Home
            </a>
        </div>
    </header>

    <div class="main-grid">
        <div class="camera-panel state-detecting" id="camPanel">
            <div class="cam-feed">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="skeletonCanvas"></canvas>
            </div>
            <div class="status-bar">
                <div id="modeIndicator" style="color: #10b981;">DETECTING...</div>
                <div class="last-cmd" id="cmdDisplay">Waiting for sign...</div>
            </div>
        </div>

        <div class="devices-grid">
            <div class="device-card" id="dev-light">
                <i class="fas fa-lightbulb device-icon"></i>
                <div>
                    <div class="device-name">Smart Light</div>
                    <div class="device-status">OFF</div>
                </div>
            </div>

            <div class="device-card" id="dev-fan">
                <i class="fas fa-fan device-icon"></i>
                <div>
                    <div class="device-name">Smart Fan</div>
                    <div class="device-status">OFF</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Modal for Camera Issues -->
    <div id="errorModal" class="modal-overlay">
        <div class="modal-content">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ef4444; margin-bottom: 20px;"></i>
            <h2 style="margin-bottom: 10px; color: #fff;">Camera Needed</h2>
            <p id="errorMessage" style="margin-bottom: 25px; color: #a1a1aa; line-height: 1.5;">
                Deep inference requires visual payloads. Please allow camera access in your browser settings.
            </p>
            <button class="btn" onclick="document.getElementById('errorModal').style.display='none'"
                style="margin: 0 auto; background: #fff; color: #000;">
                Dismiss
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('skeletonCanvas');
        const ctx = canvas.getContext('2d');
        const cmdDisplay = document.getElementById('cmdDisplay');

        // SETUP
        async function setupCamera() {
            try {
                // Request HD resolution for a crisp UI experience
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
                video.srcObject = stream;
                return true; // Retained original return for syntactic correctness
            } catch (err) {
                console.error("Camera Setup Error:", err);
                document.getElementById('errorModal').style.display = 'flex';
                // Stop automation immediately if camera fails
                if (automationActive) toggleAutomation();
                const modeIndicator = document.getElementById('modeIndicator');
                modeIndicator.innerText = "CAMERA DISABLED";
                modeIndicator.style.color = "#ff3b30";
                cmdDisplay.innerText = "Error: Camera Access required.";
                return false;
            }
        }

        function drawSkeleton() {
            // Disabled per user request
            // We still need to keep the canvas clear to avoid old drawings from sticking around if it was previously active.
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // TOGGLE DEVICE UI
        async function toggleDevice(id, state) {
            const card = document.getElementById(id);
            const statusText = card.querySelector('.device-status');

            if (state) {
                card.classList.add('active');
                statusText.innerText = (id === 'dev-door') ? "UNLOCKED" : "ON";
            } else {
                card.classList.remove('active');
                statusText.innerText = (id === 'dev-door') ? "LOCKED" : "OFF";
            }
        }

        // SOCKET.IO REALTIME PREDICTIONS
        const socket = io(); // Connects to the same host that served the page

        socket.on('connect', () => {
            console.log("Connected to server, setting IoT mode");
            cmdDisplay.innerText = "Connected. Scanning for signs...";
            socket.emit('set_mode', 'iot');
        });

        // Track current state to handle toggling
        let deviceStates = {
            'dev-light': false,
            'dev-fan': false
        };

        // Engine status updates from backend removed to prevent conflicting with the local 3s/2s detection cycle.

        // Track current execution state to freeze detection
        let isExecuting = false;

        socket.on('prediction', async (data) => {
            if (isExecuting) return; // Ignore any late predictions if already executing
            if (!isDetectingWindow) return; // Ignore outside of detection window

            console.log("Prediction received:", data);

            // Always display the top guess from the backend, even if it's low confidence
            cmdDisplay.innerText = `Top Match: ${data.text} (${Math.round(data.conf * 100)}%)`;
            cmdDisplay.style.animation = "none";
            setTimeout(() => cmdDisplay.style.animation = "fadeIn 0.2s", 10);

            // ONLY EXECUTE IF CONFIDENCE REACHES 65%
            if (data.conf < 0.65) {
                return;
            }

            // Skip the 'none' background class — it means no sign was detected
            if (data.text.toLowerCase() === "none") {
                return;
            }

            isExecuting = true;
            isDetectingWindow = false; // Stop accepting new signs

            const cmd = data.text.toLowerCase();
            const camPanel = document.getElementById('camPanel');
            const modeIndicator = document.getElementById('modeIndicator');

            // Friendly display names for the status bar
            const friendlyNames = {
                'bulb_on': 'Light ON',
                'bulb_off': 'Light OFF',
                'light': 'Light Toggle',
                'fan_on': 'Fan ON',
                'fan_off': 'Fan OFF',
                'fan': 'Fan Toggle',
                'stop': 'Fan OFF'
            };
            const displayName = friendlyNames[cmd] || data.text;

            // Visual freeze for executing state
            camPanel.className = 'camera-panel state-executing';
            camPanel.style.borderColor = ""; // Reset inline style
            modeIndicator.innerText = "EXECUTING COMMAND...";
            modeIndicator.style.color = "#007bff";
            cmdDisplay.innerText = `Executing: ${displayName} (${Math.round(data.conf * 100)}%)`;
            cmdDisplay.className = "last-cmd success";

            // Revert color after a bit
            setTimeout(() => {
                cmdDisplay.className = "last-cmd";
            }, 1000);

            cmdDisplay.style.animation = "none";
            setTimeout(() => cmdDisplay.style.animation = "fadeIn 0.2s", 10);

            // Simulate device response delay
            await delay(2000);

            if (cmd === "bulb_on") {
                deviceStates['dev-light'] = true;
                await toggleDevice('dev-light', true);
                cmdDisplay.innerText = "Light ON";
            }
            else if (cmd === "bulb_off") {
                deviceStates['dev-light'] = false;
                await toggleDevice('dev-light', false);
                cmdDisplay.innerText = "Light OFF";
            }
            else if (cmd === "light") {
                deviceStates['dev-light'] = !deviceStates['dev-light'];
                await toggleDevice('dev-light', deviceStates['dev-light']);
                cmdDisplay.innerText = deviceStates['dev-light'] ? "Light ON" : "Light OFF";
            }
            else if (cmd === "fan_on") {
                deviceStates['dev-fan'] = true;
                await toggleDevice('dev-fan', true);
                cmdDisplay.innerText = "Fan ON";
            }
            else if (cmd === "fan_off" || cmd === "stop") {
                deviceStates['dev-fan'] = false;
                await toggleDevice('dev-fan', false);
                cmdDisplay.innerText = "Fan OFF";
            }
            else if (cmd === "fan") {
                deviceStates['dev-fan'] = !deviceStates['dev-fan'];
                await toggleDevice('dev-fan', deviceStates['dev-fan']);
                cmdDisplay.innerText = deviceStates['dev-fan'] ? "Fan ON" : "Fan OFF";
            }

            cmdDisplay.className = "last-cmd success";
            await delay(1500); // Show the result status before continuing

            isExecuting = false;
        });

        // SEND FRAMES TO BACKEND FOR PREDICTION
        let transInterval = null;
        let isDetectingWindow = true;

        // sleep helper
        const delay = ms => new Promise(res => setTimeout(res, ms));

        // 4 seconds on, 3 seconds off
        let automationActive = true;

        function toggleAutomation() {
            automationActive = !automationActive;
            const btn = document.getElementById('automationToggleBtn');
            const icon = btn.querySelector('i');
            const text = btn.querySelector('span');
            const camPanel = document.getElementById('camPanel');
            const modeIndicator = document.getElementById('modeIndicator');

            if (automationActive) {
                btn.style.background = '#ff3b30';
                icon.className = 'fas fa-pause';
                text.innerText = 'Stop Automation';
            } else {
                btn.style.background = 'rgba(16, 185, 129, 0.15)';
                icon.className = 'fas fa-play';
                text.innerText = 'Start Automation';

                // Set UI to paused state immediately
                camPanel.className = 'camera-panel';
                camPanel.style.borderColor = '#555';
                modeIndicator.innerText = "AUTOMATION PAUSED";
                modeIndicator.style.color = "#aaa";
                cmdDisplay.innerText = "System Idle - Turning OFF all devices...";
                isDetectingWindow = false;

                // Send OFF command for all currently ON devices
                for (const dev_id in deviceStates) {
                    if (deviceStates[dev_id]) {
                        // Determine the underlying "sign" command that maps to off
                        let offCmd = "";
                        if (dev_id === 'dev-light') offCmd = "bulb_off";
                        else if (dev_id === 'dev-fan') offCmd = "fan_off";
                        // Add other devices here as they are added to the system

                        if (offCmd !== "") {
                            deviceStates[dev_id] = false;
                            toggleDevice(dev_id, false);
                        }
                    }
                }

                setTimeout(() => { if (!automationActive) cmdDisplay.innerText = "System Idle"; }, 2000);
            }
        }

        async function startDetectionCycle() {
            const camPanel = document.getElementById('camPanel');
            const modeIndicator = document.getElementById('modeIndicator');

            while (true) {
                if (!automationActive) {
                    await delay(500);
                    continue; // Wait until automation is turned back on
                }

                if (isExecuting) {
                    await delay(100);
                    continue; // Wait until execution clears before restarting cycle
                }

                // Phase 1: Detecting (up to 4s)
                isDetectingWindow = true;
                camPanel.className = 'camera-panel state-detecting';
                camPanel.style.borderColor = ""; // Reset inline style
                modeIndicator.innerText = "DETECTING (4s)...";
                modeIndicator.style.color = "#00e676";
                cmdDisplay.innerText = "Waiting for sign...";

                // Wait up to 4 seconds, aborting early if a sign is recognized
                let detectMs = 0;
                while (detectMs < 4000) {
                    if (isExecuting || !automationActive) break; // Command detected or paused, aborting the wait
                    await delay(100);
                    detectMs += 100;
                }

                if (!automationActive) continue;

                // If we aborted because of execution, wait until execution finishes before the cooldown
                while (isExecuting) {
                    await delay(100);
                }

                // Phase 2: Cooldown Gap (3s)
                isDetectingWindow = false;
                camPanel.className = 'camera-panel state-cooldown';
                modeIndicator.innerText = "GAP (3s) - PAUSED...";
                modeIndicator.style.color = "#ff3b30";

                let gapMs = 0;
                while (gapMs < 3000) {
                    if (!automationActive) break;
                    await delay(100);
                    gapMs += 100;
                }
            }
        }

        function startTranslation() {
            const processCanvas = document.createElement('canvas');
            const context = processCanvas.getContext('2d');

            transInterval = setInterval(() => {
                if (!video.srcObject) return;

                // CRITICAL FIX: Only send frames when actively detecting.
                // This gives the backend time to clear its sequence buffer during the gap,
                // guaranteeing that new signs require a completely fresh 2-second capture.
                if (!isDetectingWindow) return;

                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    // Downscale the AI feed to 640x480 to keep the websocket fast,
                    // even though the user sees 720p HD on their screen.
                    processCanvas.width = 640;
                    processCanvas.height = 480;

                    // Draw frame
                    context.drawImage(video, 0, 0, processCanvas.width, processCanvas.height);

                    // Compress to JPEG (Must be 0.8 to match training conditions)
                    const dataUrl = processCanvas.toDataURL('image/jpeg', 0.8);

                    // Send to server
                    socket.emit('process_frame', dataUrl);
                }
            }, 66); // 15 FPS (1000ms / 15 frames)
        }

        window.onload = () => {
            setupCamera().then((success) => {
                if (success) {
                    drawSkeleton();
                    startDetectionCycle();
                    startTranslation(); // Start sending frames once camera is ready
                }
            });
        };
    </script>
</body>

</html>
